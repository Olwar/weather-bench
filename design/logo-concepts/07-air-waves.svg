<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#FAF6EF"/>
  <!-- ilma = air: three flowing wind lines -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M160 110 C 260 80, 340 140, 440 110" stroke="#8FB4D4"/>
    <path d="M160 160 C 260 130, 340 190, 440 160" stroke="#3E6E9E"/>
    <path d="M160 210 C 260 180, 340 240, 440 210" stroke="#4E7F63"/>
  </g>
  <text x="300" y="330" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="86" font-weight="600" fill="#181513">Ilma</text>
</svg>
