# weather-bench nginx site (deployed to /etc/nginx/sites-available/weather-bench).
#
# Rate limits are per client IP. Traffic normally arrives through Vercel's
# rewrite, so the client is the first hop in X-Forwarded-For; direct hits on
# the origin fall back to the socket address. Chat is the only endpoint that
# spends money (OpenRouter), so it gets its own tight bucket.
map $http_x_forwarded_for $ilma_client_ip {
    default                 $remote_addr;
    "~^(?<first>[^,\s]+)"   $first;
}
limit_req_zone $ilma_client_ip zone=ilma_api:10m  rate=60r/m;
limit_req_zone $ilma_client_ip zone=ilma_chat:10m rate=6r/m;
limit_req_status 429;

# weather-bench. Deliberately additive: it does NOT claim default_server,
# because bare-IP :80 on this box already serves another site.
#
#  :8080          -> works immediately by IP, no DNS needed
#  weather.happypalette.app on :80 -> starts working the moment an A record
#                     points here; then run certbot for TLS.

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/weather-bench.access.log;
    error_log  /var/log/nginx/weather-bench.error.log;

    location = /api/agent/chat {
        limit_req zone=ilma_chat burst=4 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /api/ {
        limit_req zone=ilma_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # upstream model fetch on a cold cache
    }
}

server {
    listen 80;
    server_name weather.happypalette.app;

    location = /api/agent/chat {
        limit_req zone=ilma_chat burst=4 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /api/ {
        limit_req zone=ilma_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
