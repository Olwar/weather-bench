# weather-bench. Deliberately additive: it does NOT claim default_server,
# because bare-IP :80 on this box already serves another site.
#
#  :8080          -> works immediately by IP, no DNS needed
#  weather.happypalette.app on :80 -> starts working the moment an A record
#                     points here; then run certbot for TLS.

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/weather-bench.access.log;
    error_log  /var/log/nginx/weather-bench.error.log;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # upstream model fetch on a cold cache
    }
}

server {
    listen 80;
    server_name weather.happypalette.app;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
